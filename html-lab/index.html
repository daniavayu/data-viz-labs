<!DOCTYPE html> 
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lab</title>
    <style>
      /* Part 2 CSS should all be within this tag. */
      h1 {
          color: rgb(157, 3, 57);
          font-size: 30px;
      }
      .main-grid {
          display: grid;
          grid-template-columns: 1fr;
      }
      nav li {
          display: inline;
      }
      nav li a{
          margin-right: 10px;
          padding: 50px;
          color: black;
          text-decoration: none;
      }
      body {
          font-family: Arial, sans-serif;
          background-color: rgb(86, 106, 86);
      }
      img {
          max-width: 100%;
          height: auto;
      }
      div.gallery {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 10px;
      }
      section {
          margin-bottom: 40px;
          padding: 20px;    
          border: 3px double black;
      } 
    </style>
</head>
<body>
    <header>
        <h1>Things I Like</h1>
    </header>
    <div class="main-grid">
        <nav>
            <ul>
                <li><a href="#flowers">Flowers</a></li>
                <li><a href="#hokusai">Katsushika Hokusai</a></li>
                <li><a href="#original">Original Art</a></li>
            </ul>
        </nav>
        <main>
        <section id="flowers">
        <h2>Flowers!!</h2>
        <div class="gallery">
            <div class="gallery-item">
                <figure>
                    <img src="images/1.jpg" alt="Daisies by Henri Matisse" width="200">
                    <figcaption><a href="https://www.artic.edu/artworks/100226/daisies">Henri Matisse</a>, Daisies</figcaption>
                </figure>
            </div>
            <div class="gallery-item">
                <figure>
                    <img src="images/2.jpg" alt="Flowers by Julian Alden Weir" width="200">
                    <figcaption><a href="https://www.artic.edu/artworks/14817/flowers">Julian Alden Weir</a>, Flowers</figcaption>
                </figure>
            </div>
            <div class="gallery-item">
                <figure>
                    <img src="images/3.jpg" alt="Basket of Flowers by Raoul Dufy" width="200">
                    <figcaption><a href="https://www.artic.edu/artworks/48616/basket-of-flowers">Raoul Dufy</a>, Basket of Flowers</figcaption>
                </figure>
            </div>
            <div class="gallery-item">
                <figure>
                    <img src="images/4.jpg" alt="Flowers by Anne Allen" width="200">
                    <figcaption><a href="https://www.artic.edu/artworks/25752/flowers">Anne Allen</a>, Flowers</figcaption>
                </figure>
            </div>
            <div class="gallery-item">
                <figure>
                    <img src="images/5.jpg" alt="Water Lily Pond by Claude Monet" width="200">
                    <figcaption><a href="https://www.artic.edu/artworks/97933/water-lily-pond">Claude Monet</a>, Water Lily Pond</figcaption>
                </figure>
            </div>
                </figure>
            <div class="gallery-item">
                <figure>
                    <img src="images/11.jpg" alt="Water Lily Pond by Claude Monet" width="200">
                    <figcaption><a href="https://www.artic.edu/artworks/196939/cherry-blossoms-and-lantern">Claude Monet</a>, Cherry Blossoms and Lantern</figcaption>
                </figure>
            </div>
        </div>
        </section>
        <section id="hokusai">
        <h2>Katsushika Hokusai 葛飾 北斎</h2>
        <div class="gallery">
            <div class="gallery-item">
                <figure>
                    <img src="images/6.jpg" alt="Under the Wave off Kanagawa" width="200">
                    <figcaption><a href="https://www.artic.edu/artworks/89503/under-the-wave-off-kanagawa-kanagawa-oki-nami-ura-also-known-as-the-great-wave-from-the-series-thirty-six-views-of-mount-fuji-fugaku-sanjurokkei">Katsushika Hokusai</a>, Under the Wave off Kanagawa</figcaption>
                </figure>
            </div>
            <div class="gallery-item">
                <figure>
                    <img src="images/7.jpg" alt="Shower below the Summit" width="200">
                    <figcaption><a href="https://www.artic.edu/artworks/87008/shower-below-the-summit-sanka-hakuu-from-the-series-thirty-six-views-of-mount-fuji-fugaku-sanjurokkei">Katsushika Hokusai</a>, Shower below the Summit</figcaption>
                </figure>
            </div>
            <div class="gallery-item">
                <figure>
                    <img src="images/8.jpg" alt="Togetsu Bridge at Arashiyama in Yamashiro Province" width="200">
                    <figcaption><a href="https://www.artic.edu/artworks/3652/togetsu-bridge-at-arashiyama-in-yamashiro-province-yamashiro-arashiyama-no-togetsukyo-from-the-series-unusual-views-of-famous-bridges-in-various-provinces-shokoku-meikyo-kiran">Katsushika Hokusai</a>, Togetsu Bridge at Arashiyama in Yamashiro Province</figcaption>
                </figure>
            </div>
            <div class="gallery-item">
                <figure>
                    <img src="images/9.jpg" alt="Yoro Waterfall in Mino Province" width="200">
                    <figcaption><a href="https://www.artic.edu/artworks/13255/yoro-waterfall-in-mino-province-mino-no-kuni-yoro-no-taki-from-the-series-tour-of-the-waterfalls-in-various-provinces-shokoku-takimeguri">Katsushika Hokusai</a>, Yoro Waterfall in Mino Province</figcaption>
                </figure>
            </div>
            <div class="gallery-item">
                <figure>
                    <img src="images/10.jpg" alt="The Mansion of the Plates" width="200">
                    <figcaption><a href="https://www.artic.edu/artworks/47407/the-mansion-of-the-plates-sara-yashiki-from-the-series-one-hundred-ghost-tales-hyaku-monogatari">Katsushika Hokusai</a>, The Mansion of the Plates</figcaption>
                </figure>
            </div>
            <div class="gallery-item">
                <figure>
                    <img src="images/12.jpg" alt="Clearing Weather at Awazu" width="200">
                    <figcaption><a href="https://www.artic.edu/artworks/57283/clearing-weather-at-awazu-awazu-no-seiran-from-the-series-eight-views-of-omi-in-etching-style-doban-omi-hakkei">Katsushika Hokusai</a>, The Mansion of the Plates</figcaption>
                </figure>
            </div>
        </div>
        </section>
        <section id="original">
        <h2>Original Art</h2>
        <div class="gallery">
<svg width="200" height="200">
    <!-- background -->
    <rect width="200" height="200" style="fill:rgb(94, 94, 221);"/>
    
    <!-- stem -->
    <rect x="97" y="100" width="6" height="100" style="fill:green;"/>

    <!-- petals: 4 circles around the center -->
    <circle cx="100" cy="65"  r="25" style="fill:pink;"/>
    <circle cx="100" cy="135" r="25" style="fill:pink;"/>
    <circle cx="65"  cy="100" r="25" style="fill:pink;"/>
    <circle cx="135" cy="100" r="25" style="fill:pink;"/>

    <!-- center -->
    <circle cx="100" cy="100" r="18" style="fill:gold;"/>
</svg>
        </div>
        </section>
        </main>
    </div>
<!-- Part 1 Content should all be within the body -->

</body>
</html>
